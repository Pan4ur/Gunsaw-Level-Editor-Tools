name: Build and release

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download build dependencies
        env:
          DEPENDENCIES_URL: ${{ secrets.GUNSAW_BUILD_DEPENDENCIES_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dependencyUri = $env:DEPENDENCIES_URL
          $archivePath = Join-Path $env:RUNNER_TEMP 'gunsaw-build-dependencies.zip'
          $gameDirectory = Join-Path $env:RUNNER_TEMP 'gunsaw-build-dependencies'
          try {
            Invoke-WebRequest -Uri $dependencyUri -OutFile $archivePath
          } catch {
            throw 'Could not download build dependencies'
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $gameDirectory
          [xml]$project = Get-Content -LiteralPath 'src/GunsawLevelEditorTools/GunsawLevelEditorTools.csproj' -Raw
          foreach ($reference in $project.Project.ItemGroup.Reference) {
            if ($reference.HintPath) {
              $referencePath = $reference.HintPath.Replace('$(GameDir)', $gameDirectory)
              if (-not (Test-Path -LiteralPath $referencePath -PathType Leaf)) {
                throw "Build dependency is missing: $($reference.Include)"
              }
            }
          }
          "GAME_PATH=$gameDirectory" >> $env:GITHUB_ENV

      - name: Restore mod
        run: dotnet restore src/GunsawLevelEditorTools/GunsawLevelEditorTools.csproj "-p:GameDir=$env:GAME_PATH"

      - name: Build mod
        run: dotnet build src/GunsawLevelEditorTools/GunsawLevelEditorTools.csproj --configuration Release --no-restore "-p:GameDir=$env:GAME_PATH" --output dist

      - name: Publish image converter
        run: dotnet publish src/GunsawArtConverter/GunsawArtConverter.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output dist

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: GunsawLevelEditorTools-${{ github.sha }}
          path: |
            dist/GunsawLevelEditorTools.dll
            dist/GunsawArtConverter.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: GunsawLevelEditorTools-${{ github.sha }}
          path: dist

      - name: Publish latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $api = "$env:GITHUB_API_URL/repos/$env:GH_REPO"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
          }
          function Get-OptionalResource([string]$Uri) {
            try {
              Invoke-RestMethod -Uri $Uri -Headers $headers
            } catch {
              if ($_.Exception.Response.StatusCode -ne 404) { throw }
            }
          }
          $branch = Invoke-RestMethod -Uri "$api/git/ref/heads/main" -Headers $headers
          if ($branch.object.sha -ne $env:GITHUB_SHA) {
            Write-Output 'Skipping an older build: main has already advanced.'
            exit 0
          }
          $release = Get-OptionalResource "$api/releases/tags/latest"
          if ($release -and $release.immutable) {
            throw 'The existing latest release must be mutable.'
          }
          $tag = Get-OptionalResource "$api/git/ref/tags/latest"
          if ($tag) {
            $body = @{ sha = $env:GITHUB_SHA; force = $true } | ConvertTo-Json
            Invoke-RestMethod -Method Patch -Uri "$api/git/refs/tags/latest" -Headers $headers -ContentType 'application/json' -Body $body | Out-Null
          } else {
            $body = @{ ref = 'refs/tags/latest'; sha = $env:GITHUB_SHA } | ConvertTo-Json
            Invoke-RestMethod -Method Post -Uri "$api/git/refs" -Headers $headers -ContentType 'application/json' -Body $body | Out-Null
          }
          $notesPath = Join-Path $env:RUNNER_TEMP 'latest-notes.md'
          @"
          Latest build from main.

          Commit: $env:GITHUB_SHA
          Build: $env:GITHUB_SERVER_URL/$env:GH_REPO/actions/runs/$env:GITHUB_RUN_ID
          "@ | Set-Content -LiteralPath $notesPath -Encoding utf8
          if (-not $release) {
            gh release create latest --verify-tag --draft --latest=false --title 'Latest' --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the latest release.' }
          }
          gh release upload latest dist/GunsawLevelEditorTools.dll dist/GunsawArtConverter.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release files.' }
          gh release edit latest --draft=false --prerelease=false --latest --title 'Latest' --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the latest release.' }
